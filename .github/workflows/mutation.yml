name: Mutation

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - 'plan/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutation:
    name: Mutation (${{ matrix.domain }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        domain: [cli-core, cli-args, cli-output, diagnostics-core, diagnostics-report, catalog, env-aux]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo tools and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-mutants
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-mutants-env-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: cargo-mutants-env-${{ runner.os }}-

      - name: Cache baseline debug build
        uses: actions/cache@v6
        with:
          path: target/debug
          key: cargo-mutants-debug-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: cargo-mutants-debug-${{ runner.os }}-

      - name: Install cargo-mutants
        run: command -v cargo-mutants >/dev/null || cargo install cargo-mutants --locked

      - name: Run mutation tests on pull request diff
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          if ! git diff "origin/${{ github.base_ref }}..HEAD" > git.diff 2>/dev/null || [ ! -s git.diff ]; then
            echo "Base ref unavailable or empty diff; running full suite instead"
            scripts/bash/mutation/index.sh run "${{ matrix.domain }}"
          else
            scripts/bash/mutation/index.sh run "${{ matrix.domain }}" --in-diff git.diff
          fi

      - name: Run full mutation suite
        if: github.event_name != 'pull_request'
        run: scripts/bash/mutation/index.sh run "${{ matrix.domain }}"
