name: NPM Release Recovery

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish or retag, such as 0.1.3 or v0.1.3"
        required: true
        type: string
      dist_tag:
        description: "NPM dist-tag to publish or move"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - stable
          - beta
      dry_run:
        description: "Build and validate without publishing or retagging"
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  npm-recovery:
    name: Publish or Retag NPM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Normalize version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must be X.Y.Z or vX.Y.Z: ${{ inputs.version }}" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: npm/terminal-jarvis/package-lock.json

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-npm-recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: cargo-npm-recovery-${{ runner.os }}-

      - name: Install a dist-tag-capable npm
        run: npm install -g npm@latest

      - name: Build npm package stage
        run: scripts/bash/release/index.sh package build dist/npm-release

      # One publisher for the tag job and every manual channel run: it polls
      # until the registry serves the version and the requested tag.
      - name: Publish or retag package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          args="--version $VERSION --dist-tags $DIST_TAG --artifacts-dir dist/npm-release"
          if [ "$DRY_RUN" = "true" ]; then
            args="$args --dry-run"
          fi
          scripts/bash/release/index.sh publish-npm $args
