name: NPM Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish or tag as stable, such as 0.1.3"
        required: true
        default: "0.1.3"
        type: string
      dry_run:
        description: "Build and validate without publishing or retagging"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  npm-stable:
    name: Publish or Tag Stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: npm/terminal-jarvis/package-lock.json

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-npm-stable-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: cargo-npm-stable-${{ runner.os }}-

      - name: Install a dist-tag-capable npm
        run: npm install -g npm@latest

      - name: Build npm package stage
        run: scripts/bash/release/index.sh package build dist/npm-release

      # The shared publisher polls until the registry serves the version and
      # every channel, so a manual run cannot fail on the write/read race.
      - name: Publish or retag stable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          DIST_TAG: stable
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          args="--version $VERSION --dist-tags $DIST_TAG --artifacts-dir dist/npm-release"
          if [ "$DRY_RUN" = "true" ]; then
            args="$args --dry-run"
          fi
          scripts/bash/release/index.sh publish-npm $args
