[package]
name = "terminal-jarvis"
version = "0.1.17"
edition = "2021"
description = "A data-driven harness switcher for AI coding agents"
authors = ["BA-CalderonMorales"]
license = "MIT"
repository = "https://github.com/BA-CalderonMorales/terminal-jarvis"
homepage = "https://github.com/BA-CalderonMorales/terminal-jarvis"
documentation = "https://docs.rs/terminal-jarvis"
rust-version = "1.82"
readme = "README.md"
keywords = ["cli", "ai", "agents", "harness"]
categories = ["command-line-utilities", "development-tools"]
build = "build/build.rs"
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/build/**",
  "/src/**",
  "/harnesses/**",
  "/gates/**",
  "/tests/**",
  "/docs/*.md",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[[bin]]
name = "terminal-jarvis"
path = "src/main.rs"

[lib]
name = "terminal_jarvis"
path = "src/lib.rs"

[[test]]
name = "cli"
path = "tests/cli/index.rs"

[[test]]
name = "catalog"
path = "tests/catalog/index.rs"

[[test]]
name = "gates"
path = "tests/gates/index.rs"

[[test]]
name = "diagnostics"
path = "tests/diagnostics/index.rs"

[[test]]
name = "context"
path = "tests/context/index.rs"

[[test]]
name = "runtime"
path = "tests/runtime/index.rs"

[[test]]
name = "release"
path = "tests/release/index.rs"

[dependencies]

[dev-dependencies]
quickcheck = "1"
